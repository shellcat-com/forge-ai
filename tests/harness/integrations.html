<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Integration viewport checks</title><style>body{margin:0;background:#ccc;font:14px system-ui}header{padding:10px;display:flex;gap:12px;align-items:center;position:sticky;top:0;background:#eee;z-index:1}button{padding:10px}iframe{display:block;border:0;height:1000px;margin:0 auto;background:white}#stage{overflow:auto}</style></head><body><header><strong>Verification harness</strong><button data-width="390">390px</button><button data-width="768">768px</button><button data-width="1440">1440px</button><button id="zoom">200% text</button><button id="motion">Check layout</button><output id="result"></output></header><div id="stage"><iframe title="Forge integration screen" width="1440" src="./integrations-view.html#/design-library"></iframe></div><script type="module">const frame=document.querySelector('iframe');document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{frame.width=b.dataset.width});document.querySelector('#zoom').onclick=()=>{frame.contentDocument.documentElement.style.fontSize='200%';frame.contentDocument.body.style.zoom='2'};document.querySelector('#motion').onclick=()=>{const w=frame.contentWindow;document.querySelector('#result').textContent='Viewport '+w.innerWidth+'px · Overflow '+(w.document.documentElement.scrollWidth>w.innerWidth)+' · Reduced motion '+w.matchMedia('(prefers-reduced-motion: reduce)').matches};</script></body></html>
