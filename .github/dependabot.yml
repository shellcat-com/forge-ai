version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns:
          - "@eslint/*"
          - "eslint"
          - "typescript"
          - "typescript-eslint"
          - "vite"
          - "vitest"
          - "prettier"
      fonts:
        patterns:
          - "@fontsource/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Chicago
