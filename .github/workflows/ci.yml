name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.20.0]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install native PostgreSQL test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install browser for BYOK acceptance
        run: npx playwright install --with-deps chromium

      - name: Test BYOK browser flow with synthetic provider
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: npm run test:byok:browser

      - name: Verify accepted control database constraints
        run: npm run test:db:control

      - name: Build standalone control service
        run: npm run control:build
